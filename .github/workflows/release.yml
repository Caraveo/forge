name: Windows release
on:
  push:
    tags: ['v0.04']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python packaging/build.py
      - run: .\packaging\check-package.ps1
        shell: powershell
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { gh release create "$env:GITHUB_REF_NAME" --title "FORGE $env:GITHUB_REF_NAME" --generate-notes --verify-tag }
          gh release upload "$env:GITHUB_REF_NAME" dist/FORGE-v0.04-Setup.exe dist/FORGE-v0.04-x64.msi --clobber
